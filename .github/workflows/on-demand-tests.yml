name: On-demand Tests

permissions:
  contents: read

concurrency:
  group: on-demand-tests-${{ inputs.ref || github.ref }}-${{ inputs.suite }}
  # A manual run should not be killed by a second dispatch; queue instead.
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite(s) to run: both, fixtures only, or e2e only'
        type: choice
        options:
          - both
          - fixtures
          - e2e
        default: both
      ref:
        description: >-
          Branch, tag, or SHA to check out. Leave blank to run the branch
          picked in the "Run workflow" dropdown above.
        type: string
        default: ''

jobs:
  fixtures:
    name: Fixtures smoke test
    if: ${{ inputs.suite == 'both' || inputs.suite == 'fixtures' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: '!ChangeMe!'
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: 'postgresql://app:!ChangeMe!@127.0.0.1:5432/app?serverVersion=17&charset=utf8'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up app
        uses: ./.github/actions/setup-app

      - name: db:reset-test (drop, create, migrate, load fixtures)
        run: composer db:reset-test

      - name: Run the slow-group fixture tests against the seeded DB
        run: composer test:slow

  e2e:
    name: Playwright E2E
    if: ${{ inputs.suite == 'both' || inputs.suite == 'e2e' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # continue-on-error was advisory (LRA-161) while the suite stabilised and
    # blocked PRs otherwise. A manually dispatched run isn't gating anything,
    # so it should report a real pass/fail instead of always going green.

    services:
      postgres:
        image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: '!ChangeMe!'
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # The managed PHP server and the seed/restore commands all read this. Point
      # it at the E2E lane (base name `app_e2e`); the test env appends the `_test`
      # suffix, so the suite runs against the physical `app_e2e_test` database
      # (LRA-176) — distinct from the dev database (`app`) and the
      # functional/integration rollback database (`app_test`).
      DATABASE_URL: 'postgresql://app:!ChangeMe!@127.0.0.1:5432/app_e2e?serverVersion=17&charset=utf8'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up app
        uses: ./.github/actions/setup-app

      - name: Build Tailwind CSS
        run: php bin/console tailwind:build

      # The ephemeral postgres service starts with only the `app` database, so
      # provision the E2E lane database first — the CI analog of the persistent
      # lane provisioned in LRA-176. (app:seed:e2e introspects the connection to
      # guard the lane before it can create the database, so the database must
      # already exist when it runs.) This mirrors the "Create the test database"
      # step in the PHPUnit job of ci.yml.
      - name: Provision the E2E database
        run: php bin/console --env=test doctrine:database:create --if-not-exists

      # Seed once (migrate forward + load fixtures + capture a template
      # snapshot), then restore from that snapshot so the suite runs against the
      # fast restore path — the same path used to reset state locally between
      # runs (LRA-177) — rather than the slow per-fixture command dispatch of
      # `composer db:reset-test`. The commands are invoked directly (not via the
      # `composer seed:e2e`/`reset:e2e` wrappers, whose `@putenv` hardcodes a
      # local URL) so they inherit the job's DATABASE_URL — the single source of
      # truth shared with the managed PHP server below. Snapshot/restore uses
      # Postgres TEMPLATE databases through the PHP pdo_pgsql driver, so no
      # psql/pg_dump client tools are needed on the runner.
      - name: Seed the E2E database and capture a snapshot
        run: php bin/console --env=test app:seed:e2e

      - name: Restore the E2E database from the snapshot
        run: php bin/console --env=test app:reset:e2e

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E (headless)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
