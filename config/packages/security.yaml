security:
    # LRA-270: explicit rather than relying on the framework default, so
    # the strategy this codebase's authorization model depends on is
    # visible and pinned. `affirmative` grants as soon as one voter
    # (here, PrivilegeVoter) grants and no voter denies first;
    # `allow_if_all_abstain: false` fails closed when every voter
    # abstains (an unrecognised attribute, or no voter registered for
    # it) rather than the framework default of allowing. This is the
    # authorization gate; access_control below is the authentication
    # gate and keeps its existing coarse shape.
    access_decision_manager:
        strategy: affirmative
        allow_if_all_abstain: false

    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        # The custom SecurityUser adapter implements PasswordAuthenticatedUserInterface,
        # so the interface entry still covers the firewall-side hashing.
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        # Named hasher referenced by App\Users\Application\Command\RegisterUserHandler
        # via PasswordHasherFactoryInterface->getPasswordHasher('users').
        users: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # LRA-21: load users via the SecurityUserProvider, which delegates
        # to the App\Users\Domain\Users port rather than coupling to a
        # specific entity class.
        app_user_provider:
            id: App\Users\Infrastructure\Security\SecurityUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed.
            # 'assets/' covers AssetMapper, which this project uses.
            pattern: ^/(_profiler|_wdt|assets)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Users\Infrastructure\Security\UserChecker

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                # Post-login landing: app_dashboard is referenced by route
                # name (not URL) so a future URL change here does not
                # silently break the redirect. LoginRedirectTest enforces
                # this contract against the live router.
                # always_use_default_target_path stays at its default
                # (false) so a deep link (?_target_path=...) survives the
                # login round-trip — important when staff bookmark feature
                # pages and re-authenticate.
                default_target_path: app_dashboard

            logout:
                path: app_logout
                enable_csrf: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/health$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
            users:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
