# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Mock selected-facility indicator shown in the authenticated app shell
    # header. Will be driven by the user's actual facility selection once the
    # Facilities context lands; until then the shell needs a concrete value.
    app.selected_facility_mock: 'Main Facility'
    # Hide the "Export Duplicates" action on the View Members page until the
    # downstream report exists. The button is rendered only when this flag is
    # true so the page does not advertise a feature operators cannot use.
    app.users_export_duplicates_enabled: false
    # Build version surfaced in the app shell footer. Defaults to "dev" so
    # locally-run instances still render something; CI/CD provides the real
    # version via the APP_BUILD_VERSION environment variable.
    app.build_version: '%env(default:default_build_version:string:APP_BUILD_VERSION)%'
    default_build_version: 'dev'
    # Default Faker seed for fixture loads. Override via FIXTURE_SEED env
    # to switch to a different but still stable dataset.
    default_fixture_seed: 1
    # LRA-207: root directory member profile photos are written under.
    # Only /app/var is writable in production, so this defaults under
    # var/ rather than public/ — photos are never served as static
    # files, only streamed through the authenticated MemberPhotoController.
    # Override via MEMBER_PHOTO_DIR for deployments that mount a
    # different writable path.
    app.member_photo_dir: '%env(default:default_member_photo_dir:string:MEMBER_PHOTO_DIR)%'
    default_member_photo_dir: '%kernel.project_dir%/var/uploads/member-photos'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Users/Domain/User.php'
            - '../src/Users/Domain/Event/'
            - '../src/Users/Domain/Exception/'
            - '../src/Users/Domain/ValueObject/'
            - '../src/Users/Domain/AggregateRoot.php'
            - '../src/Users/Application/Command/RegisterUser.php'
            - '../src/Users/Application/Command/ChangeUserPassword.php'
            # LRA-213: primitive-only command DTOs for the one-time-password
            # use cases, same treatment as RegisterUser/ChangeUserPassword above.
            - '../src/Users/Application/Command/IssueOneTimePassword.php'
            - '../src/Users/Application/Command/ConsumeOneTimePassword.php'
            - '../src/Users/Application/Command/EstablishPassword.php'
            - '../src/Users/Infrastructure/Persistence/Doctrine/Type/'
            - '../src/Households/Infrastructure/Persistence/Doctrine/Type/'
            - '../src/Households/Domain/Household.php'
            - '../src/Households/Domain/HouseholdMember.php'
            - '../src/Households/Domain/Event/'
            - '../src/Households/Domain/Exception/'
            - '../src/Households/Domain/ValueObject/'
            - '../src/Households/Domain/AggregateRoot.php'
            - '../src/Households/Application/Command/RegisterHousehold.php'
            - '../src/Households/Application/Command/AddMemberToHousehold.php'
            - '../src/Households/Application/Command/UpdateMemberProfile.php'
            - '../src/Households/Application/Command/UpdateHouseholdAddress.php'
            - '../src/Households/Application/Command/ChangeMemberResidency.php'
            - '../src/Households/Application/Command/DeactivateMember.php'
            - '../src/Households/Application/Command/ReactivateMember.php'
            - '../src/Households/Application/Command/AttachMemberPhoto.php'
            - '../src/Households/Application/Command/RemoveMemberPhoto.php'
            - '../src/Households/Application/Command/MergeMembers.php'
            - '../src/Households/Integration/'
            - '../src/Households/Application/Query/Port/'
            - '../src/Households/Application/Query/SearchMembers.php'
            - '../src/Households/Application/Query/GetMemberDetail.php'
            # LRA-45: Application/Port carries the read-side ACL port for
            # member transaction history and its DTO/enum types. The port
            # interface is bound explicitly below; the DTOs must not be
            # auto-registered as services.
            - '../src/Households/Application/Port/'
            - '../src/Inventory/Infrastructure/Persistence/Doctrine/Type/'
            - '../src/Inventory/Domain/Vendor.php'
            - '../src/Inventory/Domain/AggregateRoot.php'
            - '../src/Inventory/Domain/Event/'
            - '../src/Inventory/Domain/Exception/'
            - '../src/Inventory/Domain/ValueObject/'
            # Shared kernel: framework-free VOs and exceptions consumed
            # by multiple bounded contexts. Excluded from autowiring so
            # they are not registered as services (same treatment the
            # per-context Domain folders receive above).
            - '../src/Shared/Domain/ValueObject/'
            - '../src/Shared/Domain/Exception/'
            - '../src/Kernel.php'
            # LRA-266: Administration Domain exceptions, the
            # PrivilegeDefinition value object, the parameterless
            # ListPrivilegeCatalogue query DTO, and the read-side view
            # DTOs are not services — each takes scalar or array
            # constructor arguments Symfony cannot autowire, same
            # treatment as the exception/DTO/ValueObject exclusions
            # above.
            - '../src/Administration/Domain/Exception/'
            - '../src/Administration/Domain/PrivilegeDefinition.php'
            - '../src/Administration/Application/Query/ListPrivilegeCatalogue.php'
            - '../src/Administration/Application/Query/View/'
            # LRA-268: the Role aggregate, its AggregateRoot trait, its
            # domain events, and every Domain\ValueObject are not
            # services — same treatment as the Users/Households/
            # Inventory Domain exclusions above.
            - '../src/Administration/Domain/Role.php'
            - '../src/Administration/Domain/AggregateRoot.php'
            - '../src/Administration/Domain/Event/'
            - '../src/Administration/Domain/ValueObject/'
            # LRA-268: primitive-only command DTOs for the Role write
            # use cases — Symfony cannot autowire their scalar/array
            # constructor arguments, same treatment as RegisterUser above.
            - '../src/Administration/Application/Command/DefineRole.php'
            - '../src/Administration/Application/Command/RenameRole.php'
            - '../src/Administration/Application/Command/RewordRole.php'
            - '../src/Administration/Application/Command/ReplaceRolePrivileges.php'
            - '../src/Administration/Application/Command/GrantPrivilegeToRole.php'
            - '../src/Administration/Application/Command/RevokePrivilegeFromRole.php'
            - '../src/Administration/Application/Command/RetireRole.php'
            - '../src/Administration/Application/Query/ListRoles.php'
            - '../src/Administration/Application/Query/GetRoleDetail.php'
            - '../src/Administration/Infrastructure/Persistence/Doctrine/Type/'
            # LRA-267: the Rank aggregate is not a service (same
            # treatment as Role.php above); its primitive-only command
            # and query DTOs are not autowireable, same treatment as the
            # Role DTOs above.
            - '../src/Administration/Domain/Rank.php'
            - '../src/Administration/Application/Command/DefineRank.php'
            - '../src/Administration/Application/Command/RenameRank.php'
            - '../src/Administration/Application/Command/ChangeRankSeniority.php'
            - '../src/Administration/Application/Command/GrantRoleToRank.php'
            - '../src/Administration/Application/Command/RevokeRoleFromRank.php'
            - '../src/Administration/Application/Command/RetireRank.php'
            - '../src/Administration/Application/Command/ReinstateRank.php'
            - '../src/Administration/Application/Query/SeniorityComparison.php'
            # LRA-269: the Administrator aggregate and its two child
            # entities are not services (same treatment as Role.php/
            # Rank.php above). Domain\Event, Domain\Exception, and
            # Domain\ValueObject are already excluded wholesale above,
            # so the new event/exception/value-object classes this
            # ticket adds need no further entries.
            - '../src/Administration/Domain/Administrator.php'
            - '../src/Administration/Domain/AdministratorTenure.php'
            - '../src/Administration/Domain/AdministratorRoleAssignment.php'
            # LRA-279: the six Administrator lifecycle command DTOs are
            # not services — same treatment as the Role/Rank command DTOs
            # above. The AdministratorStandingReadModel port's view DTO
            # is already covered by the wholesale Query/View/ exclusion.
            - '../src/Administration/Application/Command/GrantAdministrator.php'
            - '../src/Administration/Application/Command/RevokeAdministrator.php'
            - '../src/Administration/Application/Command/RegrantAdministrator.php'
            - '../src/Administration/Application/Command/ChangeAdministratorRank.php'
            - '../src/Administration/Application/Command/AssignRoleToAdministrator.php'
            - '../src/Administration/Application/Command/UnassignRoleFromAdministrator.php'
            # LRA-270: the parameterless GetGrantedPrivileges query DTO is
            # not a service — same treatment as ListRoles/GetRoleDetail
            # above, even though it happens to take no constructor
            # arguments. GrantedPrivilegesView is already covered by the
            # wholesale Query/View/ exclusion.
            - '../src/Administration/Application/Query/GetGrantedPrivileges.php'
            # LRA-270: the in-memory PrivilegeGrantSource adapter is a
            # test double, constructed directly (`new`) by its contract
            # test — it never needs to be a service. Without this
            # exclusion, the _instanceof rule below would tag it too and
            # UnionOfGrantSources's !tagged_iterator would collect it
            # into the PRODUCTION privilege union alongside the real
            # Doctrine sources, unlike every other InMemory adapter in
            # this codebase (those are resolved by a single named alias,
            # never a tagged collection, so an unreferenced one is
            # simply compiled out).
            - '../src/Administration/Infrastructure/Persistence/InMemory/InMemoryPrivilegeGrantSource.php'

    _instanceof:
        # LRA-270: any PrivilegeGrantSource implementation is
        # auto-tagged so UnionOfGrantSources below collects every one of
        # them without either side naming the other. Registering a new
        # source (LRA-271's time-boxed vendor support access) means
        # writing the class; no wiring change is needed here.
        App\Administration\Domain\PrivilegeGrantSource:
            tags: ['administration.privilege_grant_source']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Bind the Users\Domain IdentityGenerator port to its UUID v7 adapter.
    App\Users\Domain\IdentityGenerator: '@App\Users\Infrastructure\Identity\Uuid7IdentityGenerator'

    # Bind the Users\Domain Users repository port to its Doctrine adapter.
    App\Users\Domain\Users: '@App\Users\Infrastructure\Persistence\Doctrine\DoctrineUsers'

    # LRA-213: bind the Users\Domain OneTimePasswordGenerator port to its
    # Symfony String adapter.
    App\Users\Domain\OneTimePasswordGenerator: '@App\Users\Infrastructure\Security\Base58OneTimePasswordGenerator'

    # Bind the Households\Domain ports to their production adapters.
    # UUID v7 generation is provided by the Uuid7IdentityGenerator; the
    # repository and member-code allocator are backed by Doctrine and
    # Postgres respectively (LRA-37). In-memory adapters remain wired
    # behind named aliases under when@test for contract tests.
    App\Households\Domain\IdentityGenerator: '@App\Households\Infrastructure\Identity\Uuid7IdentityGenerator'
    App\Households\Domain\Households: '@App\Households\Infrastructure\Persistence\Doctrine\DoctrineHouseholds'
    App\Households\Domain\MemberCodeAllocator: '@App\Households\Infrastructure\Persistence\Doctrine\DoctrineMemberCodeAllocator'

    # LRA-212: bind the free-text-reason scrub port (residency-history and
    # split/merge-lineage reasons) to the Doctrine adapter. Called
    # synchronously from AnonymizeMemberHandler, inside the same
    # command.bus transaction as the aggregate write.
    App\Households\Domain\MemberFreeTextReasons: '@App\Households\Infrastructure\Persistence\Doctrine\DoctrineMemberFreeTextReasons'

    # LRA-207: bind the member photo storage port to the local-filesystem
    # adapter, rooted at app.member_photo_dir (var/uploads/member-photos
    # by default, overridable via MEMBER_PHOTO_DIR). An S3-backed adapter
    # is out of scope for this port's first implementation.
    App\Households\Domain\MemberPhotoStorage: '@App\Households\Infrastructure\Storage\LocalMemberPhotoStorage'
    App\Households\Infrastructure\Storage\LocalMemberPhotoStorage:
        arguments:
            $rootDir: '%app.member_photo_dir%'

    # Bind the Catalog ports to their production adapters. Command
    # handlers auto-register through #[AsMessageHandler]; the event bus
    # is injected by service argument resolution.
    App\Catalog\Domain\Listings: '@App\Catalog\Infrastructure\Persistence\Doctrine\DoctrineListings'
    App\Catalog\Domain\IdentityGenerator: '@App\Catalog\Infrastructure\Identity\Uuid7IdentityGenerator'

    # Bind the Inventory ports to their production adapters. The
    # Uuid7IdentityGenerator mirrors the Catalog binding; the Vendors
    # repository port is wired to the Doctrine adapter (LRA-72).
    # Remaining repository ports land in LRA-76/77.
    App\Inventory\Domain\IdentityGenerator: '@App\Inventory\Infrastructure\Identity\Uuid7IdentityGenerator'
    App\Inventory\Domain\Vendors: '@App\Inventory\Infrastructure\Persistence\Doctrine\DoctrineVendors'
    App\Inventory\Domain\InventoryItems: '@App\Inventory\Infrastructure\Persistence\Doctrine\DoctrineInventoryItems'
    App\Inventory\Domain\PurchaseOrders: '@App\Inventory\Infrastructure\Persistence\Doctrine\DoctrinePurchaseOrders'
    # Combo persistence (LRA-80 → LRA-95): wired to the Postgres-backed
    # adapter. ComboComponentEntity is the Doctrine-mapped child of
    # Combo; composite key (combo_id, item_id) matches the LRA-80 plan
    # and is hydrated EAGERly so the LRA-83 ACL sale-time expansion
    # never N+1s. The InMemory adapter is wired under when@test below
    # so domain/unit tests keep their fast shape.
    App\Inventory\Domain\Combos: '@App\Inventory\Infrastructure\Persistence\Doctrine\DoctrineCombos'
    App\Inventory\Domain\ComboGraphResolver: '@App\Inventory\Infrastructure\Persistence\InMemory\RepositoryBackedComboGraphResolver'
    # Item groups (LRA-81 → LRA-96): wired to the Postgres-backed
    # adapter. ItemGroupMembership is the Doctrine-mapped child of
    # ItemGroup; composite key (group_id, item_id) matches the
    # LRA-81 plan and is fetched LAZY because membership lists can
    # grow into the hundreds — most write paths only need the
    # parent. The (item_id, added_at DESC) index backs the LRA-97
    # per-item recent-groups read path.
    App\Inventory\Domain\ItemGroups: '@App\Inventory\Infrastructure\Persistence\Doctrine\DoctrineItemGroups'
    # Item links (LRA-82 → LRA-93): wired to the Postgres-backed adapter.
    App\Inventory\Domain\ItemLinks: '@App\Inventory\Infrastructure\Persistence\Doctrine\DoctrineItemLinks'
    # Stock movements ledger (LRA-94): append-only DBAL writer used inline
    # by the Catalog ACL for CONSUMED rows (with the transaction id
    # idempotency key) and by the AdjustStockHandler + StockReceived /
    # StockReturned / StockTransferredOut / StockTransferredIn subscribers
    # for non-consume rows. Read paths go through the LRA-97 query
    # handlers, never through this port.
    App\Inventory\Domain\StockMovementLedger: '@App\Inventory\Infrastructure\Persistence\Doctrine\DoctrineStockMovementLedger'

    # Inventory read model (LRA-97): DBAL projections backing the
    # LRA-85 list page, LRA-88 movement history, and LRA-91 reports.
    # Read paths never go through the EntityManager — no UnitOfWork,
    # no aggregate hydration, no N+1.
    App\Inventory\Application\Query\Port\InventoryReadModel: '@App\Inventory\Infrastructure\Persistence\Doctrine\Read\DoctrineInventoryReadModel'

    # Bind the Households read-model port (LRA-38) to its Doctrine adapter.
    # The adapter uses the DBAL Connection rather than the EntityManager;
    # read paths never pay UnitOfWork costs and the projection shape can
    # evolve independently of the aggregate.
    App\Households\Application\Query\Port\MemberReadModel: '@App\Households\Infrastructure\Persistence\Doctrine\Read\DoctrineMemberReadModel'

    # LRA-45: bind the read-side ACL port for member transaction history
    # to the stub adapter. The real Transactions bounded context does not
    # exist yet; when it lands, a future ticket will replace this binding
    # with the production adapter without touching the controller or
    # template that consume the port.
    App\Households\Application\Port\MemberTransactionHistory: '@App\Households\Infrastructure\Acl\Stub\StubMemberTransactionHistory'

    # LRA-189: bind the dashboard greeting's CurrentStaffMember port to the
    # Symfony Security adapter, keeping MockDashboardData decoupled from
    # Security for unit testing.
    App\Ui\Dashboard\CurrentStaffMember: '@App\Ui\Dashboard\SecurityCurrentStaffMember'

    # Inject the command bus into the SecurityUserProvider so the password
    # upgrader can dispatch a ChangeUserPassword command.
    App\Users\Infrastructure\Security\SecurityUserProvider:
        arguments:
            $commandBus: '@command.bus'

    # Wire the SearchMembersController (LRA-39) onto the query bus so its
    # GET actions can dispatch the SearchMembers query, and pass the
    # export-duplicates feature flag through as a constructor arg.
    App\Households\Infrastructure\Http\Controller\SearchMembersController:
        arguments:
            $queryBus: '@query.bus'
            $exportDuplicatesEnabled: '%app.users_export_duplicates_enabled%'
        tags: ['controller.service_arguments']

    # Wire the ListInventoryController (LRA-85) onto the query bus so its
    # GET actions can dispatch the ListInventory query (LRA-97).
    App\Inventory\Infrastructure\Http\Controller\ListInventoryController:
        arguments:
            $queryBus: '@query.bus'
        tags: ['controller.service_arguments']

    # Wire the InventoryItemFormController (LRA-86) onto both the command
    # bus (RegisterInventoryItem, UpdateInventoryItemSettings, and the
    # Catalog Listing update DTOs) and the query bus (GetInventoryItemDetail,
    # GetListingDetail for prefilling the edit form). The BarcodeRenderer
    # port is autowired by interface to the Code128 SVG adapter.
    App\Inventory\Infrastructure\Http\Controller\InventoryItemFormController:
        arguments:
            $commandBus: '@command.bus'
            $queryBus: '@query.bus'
        tags: ['controller.service_arguments']

    # Bind the BarcodeRenderer domain port to its CODE128 SVG adapter.
    App\Inventory\Domain\Barcode\BarcodeRenderer: '@App\Inventory\Infrastructure\Barcode\Code128BarcodeRenderer'

    # LRA-266: bind the Administration\Domain PrivilegeLookup port to its
    # catalogue-backed adapter. The logger is autowired to the default
    # Monolog channel — see CataloguePrivilegeLookup's docblock for why it
    # takes no null-object default.
    App\Administration\Domain\PrivilegeLookup: '@App\Administration\Infrastructure\Authorization\CataloguePrivilegeLookup'

    # LRA-268: bind the Administration\Domain Role ports to their
    # production adapters. Uuid7IdentityGenerator mirrors every other
    # context's binding; the read model uses the DBAL Connection
    # directly (CQRS-lite), never the EntityManager.
    App\Administration\Domain\IdentityGenerator: '@App\Administration\Infrastructure\Identity\Uuid7IdentityGenerator'
    App\Administration\Domain\Roles: '@App\Administration\Infrastructure\Persistence\Doctrine\DoctrineRoles'
    App\Administration\Application\Query\Port\RoleReadModel: '@App\Administration\Infrastructure\Persistence\Doctrine\Read\DoctrineRoleReadModel'

    # LRA-267: bind the Administration\Domain Ranks port to its Doctrine
    # adapter, mirroring the Roles binding above.
    App\Administration\Domain\Ranks: '@App\Administration\Infrastructure\Persistence\Doctrine\DoctrineRanks'

    # LRA-269: bind the Administration\Domain Administrators port to its
    # Doctrine adapter, mirroring the Roles/Ranks bindings above.
    App\Administration\Domain\Administrators: '@App\Administration\Infrastructure\Persistence\Doctrine\DoctrineAdministrators'

    # LRA-279: bind the AdministratorStandingReadModel port to its DBAL
    # adapter (CQRS-lite, same treatment as RoleReadModel above), and the
    # CurrentAdministrator security port to the Symfony Security adapter
    # that resolves through it.
    App\Administration\Application\Query\Port\AdministratorStandingReadModel: '@App\Administration\Infrastructure\Persistence\Doctrine\Read\DoctrineAdministratorStandingReadModel'
    App\Administration\Application\Security\CurrentAdministrator: '@App\Administration\Infrastructure\Security\SecurityCurrentAdministrator'

    # LRA-270: collect every `administration.privilege_grant_source`-tagged
    # service (RankRoleGrants, DirectRoleGrants today) into the union, and
    # bind the Domain EffectivePrivileges port to the request-scoped
    # decorator around it — never straight to the union itself, or a
    # revocation would not take effect until the memoising service
    # instance was itself replaced (see RequestScopedEffectivePrivileges's
    # own docblock on why that matters under FrankenPHP worker mode).
    App\Administration\Infrastructure\Security\UnionOfGrantSources:
        arguments:
            $sources: !tagged_iterator administration.privilege_grant_source
    # RequestScopedEffectivePrivileges type-hints its $union argument
    # against the EffectivePrivileges port it itself implements, so a
    # future decorator can be inserted without editing the class — but
    # that means autowiring cannot resolve $union on its own (the port
    # is aliased back to this very class below), so it is bound
    # explicitly to the concrete union here.
    App\Administration\Infrastructure\Security\RequestScopedEffectivePrivileges:
        arguments:
            $union: '@App\Administration\Infrastructure\Security\UnionOfGrantSources'
    App\Administration\Domain\EffectivePrivileges: '@App\Administration\Infrastructure\Security\RequestScopedEffectivePrivileges'

    # Wire the two LRA-270 read controllers onto the query bus, matching
    # the ListInventoryController convention above.
    App\Administration\Infrastructure\Http\Controller\GrantedPrivilegesController:
        arguments:
            $queryBus: '@query.bus'
        tags: ['controller.service_arguments']
    App\Administration\Infrastructure\Http\Controller\RoleListController:
        arguments:
            $queryBus: '@query.bus'
        tags: ['controller.service_arguments']

    # Wire the AddHouseholdController (LRA-40) onto the command bus so its
    # POST actions can dispatch RegisterHousehold and AddMemberToHousehold.
    App\Households\Infrastructure\Http\Controller\AddHouseholdController:
        arguments:
            $commandBus: '@command.bus'
        tags: ['controller.service_arguments']

    # Wire the MemberLookupController (LRA-46) onto the query bus so its
    # GET action can dispatch the SearchMembers query for the reusable
    # Member Lookup dialog.
    App\Households\Infrastructure\Http\Controller\MemberLookupController:
        arguments:
            $queryBus: '@query.bus'
        tags: ['controller.service_arguments']

    # Wire the MemberDetailController (LRA-41 + LRA-43) onto both the query
    # bus (GetMemberDetail) and the command bus (UpdateMemberProfile for the
    # in-card Profile edit flow). The MemberTransactionHistory port (LRA-45)
    # is autowired by interface and resolves to the Stub adapter via the
    # binding above.
    App\Households\Infrastructure\Http\Controller\MemberDetailController:
        arguments:
            $queryBus: '@query.bus'
            $commandBus: '@command.bus'
        tags: ['controller.service_arguments']

    # LRA-207: wire the MemberPhotoController onto both buses (query for
    # re-fetching MemberDetail after a mutation, command for
    # AttachMemberPhoto/RemoveMemberPhoto). The MemberPhotoStorage port
    # is autowired by interface and resolves to the local-filesystem
    # adapter via the binding above (or the in-memory test binding).
    App\Households\Infrastructure\Http\Controller\MemberPhotoController:
        arguments:
            $queryBus: '@query.bus'
            $commandBus: '@command.bus'
        tags: ['controller.service_arguments']

    # LRA-208: wire the MergeMembersController onto both buses (query for
    # the confirm dialog's side-by-side GetMemberDetail lookups, command
    # for MergeMembers).
    App\Households\Infrastructure\Http\Controller\MergeMembersController:
        arguments:
            $queryBus: '@query.bus'
            $commandBus: '@command.bus'
        tags: ['controller.service_arguments']

    # LRA-209: wire the SplitMemberController onto both buses (query to
    # prefill the dialog from GetMemberDetail, command for SplitMember).
    App\Households\Infrastructure\Http\Controller\SplitMemberController:
        arguments:
            $queryBus: '@query.bus'
            $commandBus: '@command.bus'
        tags: ['controller.service_arguments']

    # LRA-92: InventoryPurchaseOrdersFixtures needs both buses (command
    # to dispatch the lifecycle commands, query to fetch generated line
    # ids via GetPurchaseOrderDetail). The default `MessageBusInterface`
    # binding resolves to command.bus, so query.bus is wired explicitly.
    App\Inventory\Infrastructure\Fixtures\InventoryPurchaseOrdersFixtures:
        arguments:
            $commandBus: '@command.bus'
            $queryBus: '@query.bus'

    # App shell Twig globals (selected facility, build version).
    App\Ui\Twig\AppShellExtension:
        arguments:
            $selectedFacility: '%app.selected_facility_mock%'
            $buildVersion: '%app.build_version%'

# Expose select context aliases to the test container so integration tests
# can fetch them via static::getContainer()->get(...) without making them
# public in production. The Households repository, member-code allocator,
# and read model all resolve to the Doctrine adapters (DAMA wraps each
# write-path test in a transaction); the InMemory adapters are still
# wired behind named aliases (households.in_memory_*) so the shared
# contract tests can target them deliberately.
when@test:
    services:
        # LRA-69: register the LineSold post-commit contract test fixtures
        # (command + handler) so the functional KernelTestCase can dispatch
        # the failing command on the command bus and observe the rollback
        # path. These classes live under tests/ which the production
        # autoload pass does not scan.
        App\Tests\Functional\Catalog\Integration\FailingPublishHandler:
            autowire: true
            autoconfigure: true

        # LRA-279: stamps the in-request-resolved CurrentAdministrator
        # standing onto a response header so RevocationTakesEffectNextRequestTest
        # can assert what request-time application code actually saw,
        # rather than re-querying the port after kernel.terminate has
        # already reset it. See the listener's own docblock.
        App\Tests\Support\EventListener\StampsCurrentAdministratorStandingHeader:
            autowire: true
            autoconfigure: true

        App\Users\Domain\IdentityGenerator:
            alias: App\Users\Infrastructure\Identity\Uuid7IdentityGenerator
            public: true
        App\Users\Domain\Users:
            alias: App\Users\Infrastructure\Persistence\Doctrine\DoctrineUsers
            public: true
        App\Households\Domain\IdentityGenerator:
            alias: App\Households\Infrastructure\Identity\Uuid7IdentityGenerator
            public: true
        App\Households\Domain\Households:
            alias: App\Households\Infrastructure\Persistence\Doctrine\DoctrineHouseholds
            public: true
        App\Households\Domain\MemberCodeAllocator:
            alias: App\Households\Infrastructure\Persistence\Doctrine\DoctrineMemberCodeAllocator
            public: true
        households.in_memory_repository:
            alias: App\Households\Infrastructure\Persistence\InMemory\InMemoryHouseholds
            public: true
